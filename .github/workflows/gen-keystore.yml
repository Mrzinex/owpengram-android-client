name: Generate Keystore (temporary)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias androidkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "CHANGE_THIS_PASSWORD" \
            -keypass "CHANGE_THIS_PASSWORD" \
            -dname "CN=Mobugram, OU=Mobugram, O=Mobugram, L=Tehran, S=Tehran, C=IR"

      - name: Print Base64 (copy this)
        run: |
          echo "===== COPY EVERYTHING BETWEEN THE LINES ====="
          base64 -w 0 release.keystore
          echo ""
          echo "===== END ====="
