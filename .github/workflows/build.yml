name: Build Mobugram

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Inject Custom Network Files
        run: |
          cp ConnectionsManager.cpp TMessagesProj/jni/tgnet/ConnectionsManager.cpp || true
          cp Handshake.cpp TMessagesProj/jni/tgnet/Handshake.cpp || true

      - name: Fix JSON Discrepancy
        run: |
          find . -type f -name "google-services.json" -exec sed -i 's/org.telegram.messenger/com.owpengram.messenger/g' {} +
          find . -type f -name "agconnect-services.json" -exec sed -i 's/org.telegram.messenger/com.owpengram.messenger/g' {} +

      - name: Inject Custom API 
        run: |
          echo "APP_ID=${{ secrets.APP_ID }}" >> local.properties
          echo "APP_HASH=${{ secrets.APP_HASH }}" >> local.properties

      - name: Decode Release Keystore
        run: |
          mkdir -p TMessagesProj/config
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/config/release.keystore

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (Release)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleAfatRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobugram-APK
          path: '**/*.apk'
