name: Build Mobugram

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix JSON Discrepancy
        run: |
          find . -type f -name "google-services.json" -exec sed -i 's/org.telegram.messenger/com.owpengram.messenger/g' {} +
          find . -type f -name "agconnect-services.json" -exec sed -i 's/org.telegram.messenger/com.owpengram.messenger/g' {} +

      - name: Force Single Architecture (arm64-v8a)
        run: |
          cat <<EOF >> TMessagesProj/build.gradle
          
          android {
              splits {
                  abi {
                      enable true
                      reset()
                      include 'arm64-v8a'
                      universalApk false
                  }
              }
          }
          EOF

      - name: Generate Dummy Keystore
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Mobugram, OU=Dev, O=Mobugram, L=Tehran, S=Tehran, C=IR"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (Release)
        env:
          RELEASE_STORE_PASSWORD: android
          RELEASE_KEY_PASSWORD: android
          RELEASE_KEY_ALIAS: androidkey
        run: ./gradlew assembleAfatRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobugram-APK
          path: '**/*.apk'
