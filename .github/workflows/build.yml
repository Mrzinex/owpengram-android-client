name: Build Mobugram

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject API Keys
        run: |
          echo "APP_ID=${{ secrets.APP_ID }}" >> local.properties
          echo "APP_HASH=${{ secrets.APP_HASH }}" >> local.properties

      - name: Fix JSON Discrepancy
        run: |
          find . -type f -name "google-services.json" -exec sed -i 's/org.telegram.messenger/com.owpengram.messenger/g' {} +
          find . -type f -name "agconnect-services.json" -exec sed -i 's/org.telegram.messenger/com.owpengram.messenger/g' {} +

      - name: Generate Dummy Keystore
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass release_password -keypass release_password -dname "CN=Mobugram, OU=Dev, O=Mobugram, L=Tehran, S=Tehran, C=IR"
          echo "RELEASE_STORE_PASSWORD=release_password" >> local.properties
          echo "RELEASE_KEY_PASSWORD=release_password" >> local.properties
          echo "RELEASE_KEY_ALIAS=release" >> local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (AfatDebug)
        run: ./gradlew assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobugram-APK
          path: '**/*.apk'
