name: Build Mobugram

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Inject Custom Network Files
        run: |
          cp ConnectionsManager.cpp TMessagesProj/jni/tgnet/ConnectionsManager.cpp || true
          cp Handshake.cpp TMessagesProj/jni/tgnet/Handshake.cpp || true

      - name: Fix JSON Discrepancy
        run: |
          find . -type f -name "google-services.json" -exec sed -i 's/org.telegram.messenger/com.owpengram.messenger/g' {} +
          find . -type f -name "agconnect-services.json" -exec sed -i 's/org.telegram.messenger/com.owpengram.messenger/g' {} +

      - name: Inject Custom API 
        run: |
          echo "APP_ID=27838348" >> local.properties
          echo "APP_HASH=bdf80b7e702af7533bc547075dc59f01" >> local.properties

      # اگه Secret از قبل ست شده باشه، از همونی استفاده میشه (ثابت می‌مونه)
      - name: Use Existing Keystore (if secret is set)
        if: ${{ env.KEYSTORE_BASE64_EXISTS == 'true' }}
        run: |
          mkdir -p TMessagesProj/config
          echo "$KEYSTORE_B64" | base64 -d > TMessagesProj/config/release.keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_BASE64_EXISTS: ${{ secrets.KEYSTORE_BASE64 != '' }}

      # فقط اگه Secret هنوز ست نشده: یه کیستور دائمی بساز و export کن تا دانلودش کنی
      - name: Generate Keystore (first time only)
        if: ${{ env.KEYSTORE_BASE64_EXISTS != 'true' }}
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkey -v \
            -keystore TMessagesProj/config/release.keystore \
            -alias androidkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "Mobugram_2026_SecurePass!" \
            -keypass "Mobugram_2026_SecurePass!" \
            -dname "CN=Mobugram, OU=Mobugram, O=Mobugram, L=Tehran, S=Tehran, C=IR"
          base64 -w 0 TMessagesProj/config/release.keystore > keystore_base64.txt
        env:
          KEYSTORE_BASE64_EXISTS: ${{ secrets.KEYSTORE_BASE64 != '' }}

      - name: Upload Keystore Base64 (first time only — SAVE THIS AS A SECRET)
        if: ${{ env.KEYSTORE_BASE64_EXISTS != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64-SAVE-ME
          path: keystore_base64.txt
        env:
          KEYSTORE_BASE64_EXISTS: ${{ secrets.KEYSTORE_BASE64 != '' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (Release)
        env:
          RELEASE_STORE_PASSWORD: "Mobugram_2026_SecurePass!"
          RELEASE_KEY_PASSWORD: "Mobugram_2026_SecurePass!"
          RELEASE_KEY_ALIAS: androidkey
        run: ./gradlew assembleAfatRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobugram-APK
          path: '**/*.apk'
