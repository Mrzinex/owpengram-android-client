name: Build Mobugram

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Inject Custom Network Files
        run: |
          cp ConnectionsManager.cpp TMessagesProj/jni/tgnet/ConnectionsManager.cpp || true
          cp Handshake.cpp TMessagesProj/jni/tgnet/Handshake.cpp || true

      - name: Fix JSON Discrepancy
        run: |
          find . -type f -name "google-services.json" -exec sed -i 's/org.telegram.messenger/com.owpengram.messenger/g' {} +
          find . -type f -name "agconnect-services.json" -exec sed -i 's/org.telegram.messenger/com.owpengram.messenger/g' {} +

      - name: Inject Custom API 
        run: |
          echo "APP_ID=27838348" >> local.properties
          echo "APP_HASH=bdf80b7e702af7533bc547075dc59f01" >> local.properties

      - name: Generate Keystore
        run: |
          rm -f TMessagesProj/config/release.keystore
          mkdir -p TMessagesProj/config
          keytool -genkey -v \
            -keystore TMessagesProj/config/release.keystore \
            -alias androidkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "Mobugram2026Pass" \
            -keypass "Mobugram2026Pass" \
            -dname "CN=Mobugram, OU=Mobugram, O=Mobugram, L=Tehran, S=Tehran, C=IR"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (Release)
        env:
          RELEASE_STORE_PASSWORD: "Mobugram2026Pass"
          RELEASE_KEY_PASSWORD: "Mobugram2026Pass"
          RELEASE_KEY_ALIAS: androidkey
        run: ./gradlew assembleAfatRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobugram-APK
          path: '**/*.apk'
